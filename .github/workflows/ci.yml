name: RewardHub verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Backend and PostgreSQL integration checks
        run: mvn -B clean verify
      - name: Frontend and dependency checks
        run: |
          npm ci --ignore-scripts
          npm run check:frontend
          npm run test:frontend
          npm audit --audit-level=high
      - name: Runtime Maven dependency audit
        if: matrix.java == '25'
        run: |
          mvn -B dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          node scripts/audit-maven.mjs
      - name: Install browser preview prerequisites
        if: matrix.java == '25'
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          npx playwright install --with-deps chromium
      - name: Browser checks against the built release
        if: matrix.java == '25'
        run: bash frontend/scripts/browser-check.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: verification-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            test-results/browser/
          retention-days: 7

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify Gitleaks archive and scan history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          trap 'rm -rf -- "$scan_dir"' EXIT
          curl -fsSL --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scan_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
