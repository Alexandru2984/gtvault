# Include in http {}.
upstream rewardhub_backend {
    server 127.0.0.1:8087;
    keepalive 8;
}

map $uri $rewardhub_auth_key {
    default "";
    ~^/RewardHub/api/auth/(login|register)/?$ $binary_remote_addr;
}

limit_req_zone $rewardhub_auth_key zone=rewardhub_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rewardhub_api:2m rate=20r/s;

map $request_uri $rewardhub_robots {
    default "";
    ~^/(admin|autentificare|cos|finalizare|comenzi|favorite|notificari|profil|istoric|membru)(/|\?|$) "noindex, nofollow";
    ~^/(offline\.html|404)(\?|$) "noindex, nofollow";
}
