# Include in the HTTPS server {} for this host. Set root to the frontend/ directory of the active release.
# Requires the host's cloudflare-origin-guard.conf in http {}.
if ($from_cloudflare_origin = 0) { return 444; }

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header X-Robots-Tag $rewardhub_robots always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

location ^~ /RewardHub/api/ {
    client_max_body_size 64k;
    limit_req_status 429;
    limit_req zone=rewardhub_api burst=40 nodelay;
    limit_req zone=rewardhub_auth burst=5 nodelay;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_pass http://rewardhub_backend;
}

location ^~ /RewardHub/ { return 404; }

location = /gtshop.html { return 302 /$is_args$args; }
location = /login.html { return 302 /autentificare$is_args$args; }

location = / {
    expires -1;
    try_files /index.html =404;
}

location ~ ^/(magazin|compara|vouchere|activitati|wordle|clasament|bresle|comunitate|ajutor|confidentialitate|termeni|cos|finalizare|comenzi|favorite|notificari|profil|istoric|autentificare|inregistrare)/?$ {
    rewrite ^(.+)/$ $1 permanent;
    expires -1;
    try_files /pages$uri.html /index.html =404;
}

location ~ ^/(produs|comenzi|membru)/[^/]+/?$|^/admin(?:/[^/]+)?/?$ {
    rewrite ^(.+)/$ $1 permanent;
    expires -1;
    try_files /pages$uri.html /index.html =404;
}

location ~ ^/(js|css|images)/[a-zA-Z0-9_./-]+$ {
    expires -1;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    expires -1;
    try_files $uri =404;
}

location ~ ^/(sw\.js|offline\.html|robots\.txt|sitemap\.xml)$ {
    expires -1;
    try_files $uri =404;
}

location / {
    error_page 404 /index.html;
    return 404;
}

location = /index.html {
    internal;
    expires -1;
}
