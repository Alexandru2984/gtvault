<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chatgptGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="1" />
      <stop offset="100%" stop-color="#1a7f64" stop-opacity="1" />
    </linearGradient>
    <filter id="aiGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10a37f" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="30" fill="url(#chatgptGradient)" filter="url(#aiGlow)"/>
  
  <!-- ChatGPT logo style -->
  <path d="M35 35 Q50 25 65 35 Q75 50 65 65 Q50 75 35 65 Q25 50 35 35" fill="#fff" opacity="0.9"/>
  
  <!-- Inner design -->
  <circle cx="50" cy="50" r="15" fill="url(#chatgptGradient)"/>
  
  <!-- Chat bubbles -->
  <ellipse cx="42" cy="42" rx="6" ry="4" fill="#fff"/>
  <polygon points="36,44 38,47 42,45" fill="#fff"/>
  
  <ellipse cx="58" cy="58" rx="6" ry="4" fill="#fff" opacity="0.8"/>
  <polygon points="64,60 62,63 58,61" fill="#fff" opacity="0.8"/>
  
  <!-- AI brain pattern -->
  <path d="M45 40 Q50 35 55 40 Q60 45 55 50 Q50 55 45 50 Q40 45 45 40" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  
  <!-- Neural network nodes -->
  <circle cx="45" cy="40" r="1" fill="#fff"/>
  <circle cx="55" cy="40" r="1" fill="#fff"/>
  <circle cx="60" cy="50" r="1" fill="#fff"/>
  <circle cx="55" cy="60" r="1" fill="#fff"/>
  <circle cx="45" cy="60" r="1" fill="#fff"/>
  <circle cx="40" cy="50" r="1" fill="#fff"/>
  
  <!-- Connection lines -->
  <line x1="45" y1="40" x2="55" y2="40" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="55" y1="40" x2="60" y2="50" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="50" x2="55" y2="60" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="55" y1="60" x2="45" y2="60" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="45" y1="60" x2="40" y2="50" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="40" y1="50" x2="45" y2="40" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Text bubbles around -->
  <rect x="15" y="20" width="15" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <text x="22" y="25" text-anchor="middle" font-family="Arial" font-size="4" fill="#10a37f">AI</text>
  
  <rect x="70" y="35" width="15" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <text x="77" y="40" text-anchor="middle" font-family="Arial" font-size="4" fill="#10a37f">GPT</text>
  
  <rect x="15" y="65" width="15" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <text x="22" y="70" text-anchor="middle" font-family="Arial" font-size="4" fill="#10a37f">CHAT</text>
  
  <!-- Digital effects -->
  <rect x="20" y="15" width="1" height="3" fill="#10a37f" opacity="0.6"/>
  <rect x="23" y="12" width="1" height="2" fill="#10a37f" opacity="0.4"/>
  <rect x="80" y="80" width="1" height="4" fill="#10a37f" opacity="0.6"/>
  <rect x="83" y="78" width="1" height="2" fill="#10a37f" opacity="0.4"/>
  
  <!-- Title -->
  <text x="50" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">CHATGPT ACCESS</text>
</svg>
