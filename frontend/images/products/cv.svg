<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cvGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Document -->
  <rect x="20" y="10" width="60" height="80" rx="3" ry="3" fill="#fff" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- Header section -->
  <rect x="25" y="15" width="50" height="20" fill="url(#cvGradient)" opacity="0.1"/>
  
  <!-- Profile photo placeholder -->
  <circle cx="35" cy="22" r="6" fill="#a0aec0"/>
  <circle cx="35" cy="20" r="2" fill="#4a5568"/>
  <path d="M30 26 Q35 24 40 26" stroke="#4a5568" stroke-width="1" fill="none"/>
  
  <!-- Name and title -->
  <rect x="45" y="18" width="25" height="3" fill="#2d3748"/>
  <rect x="45" y="23" width="20" height="2" fill="#718096"/>
  <rect x="45" y="27" width="15" height="2" fill="#718096"/>
  
  <!-- Content sections -->
  <rect x="25" y="40" width="15" height="2" fill="url(#cvGradient)"/>
  <rect x="25" y="44" width="45" height="1" fill="#e2e8f0"/>
  <rect x="25" y="47" width="40" height="1" fill="#e2e8f0"/>
  <rect x="25" y="50" width="35" height="1" fill="#e2e8f0"/>
  
  <rect x="25" y="57" width="18" height="2" fill="url(#cvGradient)"/>
  <rect x="25" y="61" width="42" height="1" fill="#e2e8f0"/>
  <rect x="25" y="64" width="38" height="1" fill="#e2e8f0"/>
  <rect x="25" y="67" width="30" height="1" fill="#e2e8f0"/>
  
  <rect x="25" y="74" width="12" height="2" fill="url(#cvGradient)"/>
  <rect x="25" y="78" width="35" height="1" fill="#e2e8f0"/>
  <rect x="25" y="81" width="40" height="1" fill="#e2e8f0"/>
  
  <!-- Stars for rating -->
  <polygon points="65,44 66,46 68,46 67,47 67,49 65,48 63,49 63,47 62,46 64,46" fill="#feca57"/>
  <polygon points="70,44 71,46 73,46 72,47 72,49 70,48 68,49 68,47 67,46 69,46" fill="#feca57"/>
  <polygon points="65,61 66,63 68,63 67,64 67,66 65,65 63,66 63,64 62,63 64,63" fill="#feca57"/>
  <polygon points="70,61 71,63 73,63 72,64 72,66 70,65 68,66 68,64 67,63 69,63" fill="#feca57"/>
  <polygon points="75,61 76,63 78,63 77,64 77,66 75,65 73,66 73,64 72,63 74,63" fill="#feca57"/>
  
  <!-- Paper clip -->
  <path d="M18 15 Q16 15 16 17 L16 25 Q16 30 20 30 Q24 30 24 25 L24 20" 
        stroke="#4299e1" stroke-width="2" fill="none"/>
  
  <!-- Title -->
  <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">CV REVIEW</text>
</svg>
