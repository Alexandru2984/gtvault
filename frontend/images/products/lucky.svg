<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="luckyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="1" />
      <stop offset="25%" stop-color="#feca57" stop-opacity="1" />
      <stop offset="50%" stop-color="#48dbfb" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff9ff3" stop-opacity="1" />
      <stop offset="100%" stop-color="#54a0ff" stop-opacity="1" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#feca57" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Wheel base -->
  <circle cx="50" cy="50" r="35" fill="url(#luckyGradient)" stroke="#2d3748" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Wheel segments -->
  <path d="M50 15 L65 35 A35 35 0 0 1 50 85 Z" fill="#ff6b6b" opacity="0.8"/>
  <path d="M50 85 L35 65 A35 35 0 0 1 15 50 Z" fill="#feca57" opacity="0.8"/>
  <path d="M15 50 L35 35 A35 35 0 0 1 50 15 Z" fill="#48dbfb" opacity="0.8"/>
  <path d="M50 15 L85 50 A35 35 0 0 1 65 65 Z" fill="#ff9ff3" opacity="0.8"/>
  <path d="M65 65 L50 85 A35 35 0 0 1 35 65 Z" fill="#54a0ff" opacity="0.8"/>
  <path d="M35 65 L15 50 A35 35 0 0 1 35 35 Z" fill="#5f27cd" opacity="0.8"/>
  
  <!-- Center hub -->
  <circle cx="50" cy="50" r="8" fill="#2d3748" stroke="#fff" stroke-width="2"/>
  
  <!-- Pointer -->
  <polygon points="50,12 47,20 53,20" fill="#2d3748"/>
  
  <!-- Prize symbols -->
  <text x="58" y="30" font-family="Arial" font-size="8" fill="#fff">🎁</text>
  <text x="65" y="55" font-family="Arial" font-size="8" fill="#fff">💎</text>
  <text x="50" y="75" font-family="Arial" font-size="8" fill="#fff">🎊</text>
  <text x="35" y="55" font-family="Arial" font-size="8" fill="#fff">🏆</text>
  <text x="42" y="30" font-family="Arial" font-size="8" fill="#fff">⭐</text>
  <text x="35" y="40" font-family="Arial" font-size="8" fill="#fff">🎯</text>
  
  <!-- Sparkles -->
  <polygon points="20,20 22,25 27,23 23,28 28,30 23,32 27,37 22,35 20,40 18,35 13,37 17,32 12,30 17,28 13,23 18,25" fill="#feca57" opacity="0.7"/>
  <polygon points="80,75 81,78 84,77 82,80 85,81 82,82 84,85 81,84 80,87 79,84 76,85 78,82 75,81 78,80 76,77 79,78" fill="#ff6b6b" opacity="0.7"/>
  
  <!-- Title -->
  <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">LUCKY WHEEL</text>
</svg>
