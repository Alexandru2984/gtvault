<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mentorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4299e1" stop-opacity="1" />
      <stop offset="100%" stop-color="#3182ce" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="30" r="12" fill="#fbb6ce" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Body -->
  <rect x="35" y="40" width="30" height="35" rx="15" ry="15" fill="url(#mentorGradient)" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Arms -->
  <ellipse cx="25" cy="50" rx="6" ry="15" fill="url(#mentorGradient)" stroke="#2d3748" stroke-width="2"/>
  <ellipse cx="75" cy="50" rx="6" ry="15" fill="url(#mentorGradient)" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="40" y="75" width="6" height="20" fill="#2d3748"/>
  <rect x="54" y="75" width="6" height="20" fill="#2d3748"/>
  
  <!-- Face -->
  <circle cx="45" cy="27" r="2" fill="#2d3748"/>
  <circle cx="55" cy="27" r="2" fill="#2d3748"/>
  <path d="M45 33 Q50 36 55 33" stroke="#2d3748" stroke-width="2" fill="none"/>
  
  <!-- Glasses -->
  <circle cx="45" cy="27" r="4" fill="none" stroke="#2d3748" stroke-width="2"/>
  <circle cx="55" cy="27" r="4" fill="none" stroke="#2d3748" stroke-width="2"/>
  <line x1="49" y1="27" x2="51" y2="27" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Laptop -->
  <rect x="20" y="60" width="20" height="12" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
  <rect x="21" y="61" width="18" height="8" fill="#2d3748"/>
  <rect x="22" y="62" width="16" height="6" fill="#4fd1c7"/>
  
  <!-- Speech bubble -->
  <ellipse cx="75" cy="25" rx="18" ry="10" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <polygon points="65,30 60,35 70,32" fill="#fff" stroke="#2d3748" stroke-width="2"/>
  <text x="75" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2d3748">MENTOR</text>
  <text x="75" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#2d3748">GT</text>
</svg>
