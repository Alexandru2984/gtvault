<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stickerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="1" />
      <stop offset="50%" stop-color="#feca57" stop-opacity="1" />
      <stop offset="100%" stop-color="#48dbfb" stop-opacity="1" />
    </linearGradient>
    <filter id="stickerShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sticker main shape -->
  <rect x="15" y="25" width="70" height="50" rx="10" ry="10" fill="url(#stickerGradient)" filter="url(#stickerShadow)" stroke="#fff" stroke-width="2"/>
  
  <!-- Shine effect -->
  <ellipse cx="30" cy="35" rx="8" ry="4" fill="#fff" opacity="0.4" transform="rotate(-20 30 35)"/>
  
  <!-- Text -->
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">GT</text>
  <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">SHOP</text>
  
  <!-- Decorative stars -->
  <polygon points="25,15 27,20 32,20 28,23 30,28 25,25 20,28 22,23 18,20 23,20" fill="#feca57"/>
  <polygon points="75,75 76,78 79,78 77,80 78,83 75,81 72,83 73,80 71,78 74,78" fill="#ff6b6b"/>
  
  <!-- Corner curl effect -->
  <path d="M75 25 Q85 25 85 35 L80 30 Q78 28 75 30" fill="#fff" opacity="0.6"/>
</svg>
