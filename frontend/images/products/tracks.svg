<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <defs>
    <linearGradient id="tracksGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="1" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Main track path -->
  <path d="M10 80 Q25 70 40 75 Q55 80 70 70 Q85 65 100 70 Q115 75 130 65" 
        stroke="url(#tracksGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Track nodes for different specializations -->
  <circle cx="15" cy="77" r="3" fill="#e53e3e"/>
  <circle cx="30" cy="72" r="3" fill="#4299e1"/>
  <circle cx="45" cy="77" r="3" fill="#48bb78"/>
  <circle cx="60" cy="75" r="3" fill="#ed8936"/>
  <circle cx="75" cy="67" r="3" fill="#9f7aea"/>
  <circle cx="90" cy="62" r="3" fill="#38b2ac"/>
  <circle cx="105" cy="67" r="3" fill="#d69e2e"/>
  <circle cx="120" cy="70" r="3" fill="#f56565"/>
  
  <!-- Current progress indicator -->
  <circle cx="75" cy="67" r="5" fill="#feca57" stroke="#f6ad55" stroke-width="2"/>
  
  <!-- Track labels -->
  <rect x="5" y="25" width="20" height="10" rx="2" fill="#e53e3e" opacity="0.9"/>
  <text x="15" y="31" text-anchor="middle" font-family="Arial" font-size="5" fill="#fff" font-weight="bold">JS</text>
  
  <rect x="24" y="18" width="20" height="10" rx="2" fill="#4299e1" opacity="0.9"/>
  <text x="34" y="24" text-anchor="middle" font-family="Arial" font-size="5" fill="#fff" font-weight="bold">WP</text>
  
  <rect x="43" y="30" width="20" height="10" rx="2" fill="#48bb78" opacity="0.9"/>
  <text x="53" y="36" text-anchor="middle" font-family="Arial" font-size="4" fill="#fff" font-weight="bold">DESIGN</text>
  
  <rect x="62" y="20" width="20" height="10" rx="2" fill="#ed8936" opacity="0.9"/>
  <text x="72" y="26" text-anchor="middle" font-family="Arial" font-size="4.5" fill="#fff" font-weight="bold">DEV</text>
  
  <rect x="81" y="15" width="20" height="10" rx="2" fill="#9f7aea" opacity="0.9"/>
  <text x="91" y="21" text-anchor="middle" font-family="Arial" font-size="4.5" fill="#fff" font-weight="bold">JAVA</text>
  
  <rect x="100" y="30" width="20" height="10" rx="2" fill="#38b2ac" opacity="0.9"/>
  <text x="110" y="36" text-anchor="middle" font-family="Arial" font-size="4" fill="#fff" font-weight="bold">DIGITAL</text>
  
  <rect x="119" y="22" width="20" height="10" rx="2" fill="#d69e2e" opacity="0.9"/>
  <text x="129" y="28" text-anchor="middle" font-family="Arial" font-size="5" fill="#fff" font-weight="bold">PM</text>
  
  <!-- Connecting lines from labels to nodes -->
  <line x1="15" y1="35" x2="15" y2="72" stroke="#e53e3e" stroke-width="1" opacity="0.6"/>
  <line x1="34" y1="28" x2="30" y2="67" stroke="#4299e1" stroke-width="1" opacity="0.6"/>
  <line x1="53" y1="40" x2="45" y2="72" stroke="#48bb78" stroke-width="1" opacity="0.6"/>
  <line x1="72" y1="30" x2="60" y2="70" stroke="#ed8936" stroke-width="1" opacity="0.6"/>
  <line x1="91" y1="25" x2="75" y2="62" stroke="#9f7aea" stroke-width="1" opacity="0.6"/>
  <line x1="110" y1="40" x2="90" y2="57" stroke="#38b2ac" stroke-width="1" opacity="0.6"/>
  <line x1="129" y1="32" x2="120" y2="65" stroke="#d69e2e" stroke-width="1" opacity="0.6"/>
  
  <!-- Progress indicator -->
  <rect x="10" y="90" width="115" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="10" y="90" width="69" height="4" rx="2" fill="url(#tracksGradient)"/>
  
  <!-- Title -->
  <text x="70" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">ALL TRACKS ACCESS</text>
  
  <!-- Legend -->
  <text x="8" y="50" font-family="Arial" font-size="4" fill="#4a5568">JavaScript</text>
  <text x="26" y="45" font-family="Arial" font-size="4" fill="#4a5568">WordPress</text>
  <text x="45" y="52" font-family="Arial" font-size="4" fill="#4a5568">Web Design</text>
  <text x="64" y="47" font-family="Arial" font-size="4" fill="#4a5568">Web Dev</text>
  <text x="83" y="42" font-family="Arial" font-size="4" fill="#4a5568">Java</text>
  <text x="102" y="52" font-family="Arial" font-size="4" fill="#4a5568">Digital Mkt</text>
  <text x="121" y="47" font-family="Arial" font-size="4" fill="#4a5568">Project Mgmt</text>
</svg>
