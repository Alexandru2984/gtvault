<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="udemyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec5252" stop-opacity="1" />
      <stop offset="100%" stop-color="#a72828" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Screen/Display -->
  <rect x="15" y="25" width="70" height="40" rx="5" ry="5" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <rect x="18" y="28" width="64" height="34" fill="#000"/>
  
  <!-- Video player -->
  <rect x="20" y="30" width="60" height="30" fill="#4a5568"/>
  
  <!-- Play button -->
  <polygon points="45,40 45,50 55,45" fill="#fff"/>
  <circle cx="50" cy="45" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Progress bar -->
  <rect x="22" y="55" width="56" height="2" fill="#718096"/>
  <rect x="22" y="55" width="20" height="2" fill="url(#udemyGradient)"/>
  <circle cx="42" cy="56" r="2" fill="url(#udemyGradient)"/>
  
  <!-- Course info -->
  <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2d3748" font-weight="bold">Programming Course</text>
  
  <!-- Laptop base -->
  <rect x="10" y="65" width="80" height="5" rx="2" ry="2" fill="url(#udemyGradient)"/>
  
  <!-- Udemy logo area -->
  <rect x="25" y="72" width="50" height="8" fill="url(#udemyGradient)" rx="2"/>
  <text x="50" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff" font-weight="bold">UDEMY</text>
  
  <!-- Course modules -->
  <circle cx="85" cy="35" r="3" fill="#48bb78"/>
  <text x="85" y="38" text-anchor="middle" font-family="Arial" font-size="4" fill="#fff">✓</text>
  
  <circle cx="85" cy="45" r="3" fill="url(#udemyGradient)"/>
  <text x="85" y="48" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">▶</text>
  
  <circle cx="85" cy="55" r="3" fill="#718096"/>
  <text x="85" y="58" text-anchor="middle" font-family="Arial" font-size="4" fill="#fff">○</text>
  
  <!-- Rating stars -->
  <polygon points="20,82 21,84 23,84 22,85 22,87 20,86 18,87 18,85 17,84 19,84" fill="#feca57"/>
  <polygon points="25,82 26,84 28,84 27,85 27,87 25,86 23,87 23,85 22,84 24,84" fill="#feca57"/>
  <polygon points="30,82 31,84 33,84 32,85 32,87 30,86 28,87 28,85 27,84 29,84" fill="#feca57"/>
  <polygon points="35,82 36,84 38,84 37,85 37,87 35,86 33,87 33,85 32,84 34,84" fill="#feca57"/>
  <polygon points="40,82 41,84 43,84 42,85 42,87 40,86 38,87 38,85 37,84 39,84" fill="#feca57"/>
  
  <!-- Title -->
  <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">UDEMY COURSE</text>
</svg>
