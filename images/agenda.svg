<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="agendaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Agenda cover -->
  <rect x="20" y="15" width="60" height="70" rx="3" ry="3" fill="url(#agendaGradient)" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Binding -->
  <rect x="18" y="15" width="4" height="70" fill="#2d3748" rx="2"/>
  
  <!-- Pages effect -->
  <rect x="22" y="17" width="56" height="66" fill="#fff" opacity="0.9"/>
  <rect x="23" y="18" width="54" height="64" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Lines on page -->
  <line x1="27" y1="25" x2="73" y2="25" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="32" x2="73" y2="32" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="39" x2="73" y2="39" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="46" x2="73" y2="46" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="53" x2="73" y2="53" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="60" x2="73" y2="60" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="27" y1="67" x2="73" y2="67" stroke="#cbd5e0" stroke-width="1"/>
  
  <!-- Margin line -->
  <line x1="32" y1="20" x2="32" y2="78" stroke="#fbb6ce" stroke-width="1"/>
  
  <!-- Logo/title -->
  <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#667eea" font-weight="bold">GT AGENDA</text>
  
  <!-- Bookmark -->
  <rect x="75" y="15" width="6" height="25" fill="#f56565"/>
  <polygon points="78,40 75,35 81,35" fill="#f56565"/>
</svg>
