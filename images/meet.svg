<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="meetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Screen/Monitor -->
  <rect x="15" y="20" width="70" height="45" rx="5" ry="5" fill="#2d3748" stroke="#1a202c" stroke-width="3"/>
  <rect x="18" y="23" width="64" height="39" fill="#000"/>
  
  <!-- Video call participants -->
  <!-- Person 1 -->
  <rect x="20" y="25" width="28" height="17" fill="url(#meetGradient)"/>
  <circle cx="27" cy="30" r="3" fill="#fbb6ce"/>
  <rect x="24" y="33" width="6" height="8" fill="#4299e1"/>
  <text x="34" y="35" font-family="Arial" font-size="4" fill="#fff">GT</text>
  
  <!-- Person 2 -->
  <rect x="52" y="25" width="28" height="17" fill="#805ad5"/>
  <circle cx="59" cy="30" r="3" fill="#fed7d7"/>
  <rect x="56" y="33" width="6" height="8" fill="#e53e3e"/>
  <text x="66" y="35" font-family="Arial" font-size="4" fill="#fff">DEV</text>
  
  <!-- Person 3 -->
  <rect x="20" y="44" width="28" height="17" fill="#d69e2e"/>
  <circle cx="27" cy="49" r="3" fill="#fbb6ce"/>
  <rect x="24" y="52" width="6" height="8" fill="#38a169"/>
  <text x="34" y="54" font-family="Arial" font-size="4" fill="#fff">MGR</text>
  
  <!-- Person 4 -->
  <rect x="52" y="44" width="28" height="17" fill="#319795"/>
  <circle cx="59" cy="49" r="3" fill="#fed7d7"/>
  <rect x="56" y="52" width="6" height="8" fill="#805ad5"/>
  <text x="66" y="54" font-family="Arial" font-size="4" fill="#fff">QA</text>
  
  <!-- Stand -->
  <rect x="45" y="65" width="10" height="8" fill="#4a5568"/>
  <rect x="40" y="73" width="20" height="3" fill="#2d3748"/>
  
  <!-- Meeting controls -->
  <circle cx="30" cy="78" r="4" fill="#e53e3e"/>
  <text x="30" y="81" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">📹</text>
  
  <circle cx="45" cy="78" r="4" fill="#48bb78"/>
  <text x="45" y="81" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">🎤</text>
  
  <circle cx="60" cy="78" r="4" fill="#4299e1"/>
  <text x="60" y="81" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">💬</text>
  
  <!-- Title -->
  <text x="50" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">GT MEET</text>
</svg>
