<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mouseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <filter id="mouseGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f5ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Mouse body -->
  <ellipse cx="50" cy="55" rx="20" ry="30" fill="url(#mouseGradient)" stroke="#1a202c" stroke-width="2"/>
  
  <!-- Left click -->
  <path d="M30 35 Q30 25 40 25 L45 25 L45 45 Q40 50 35 45 Q30 40 30 35" fill="#374151" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Right click -->
  <path d="M55 25 L60 25 Q70 25 70 35 Q70 40 65 45 Q60 50 55 45 L55 25" fill="#374151" stroke="#1a202c" stroke-width="1"/>
  
  <!-- Scroll wheel -->
  <rect x="47" y="25" width="6" height="20" rx="3" ry="3" fill="#1a202c" stroke="#4fd1c7" stroke-width="1"/>
  <rect x="48" y="30" width="4" height="4" fill="#4fd1c7"/>
  <rect x="48" y="36" width="4" height="2" fill="#4fd1c7"/>
  
  <!-- LED light -->
  <circle cx="50" cy="70" r="4" fill="#00f5ff" filter="url(#mouseGlow)"/>
  
  <!-- Brand logo -->
  <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#4fd1c7" font-weight="bold">GT MOUSE</text>
  
  <!-- Cable -->
  <path d="M50 85 Q45 88 40 90 Q35 92 30 90 Q25 88 20 92" stroke="#2d3748" stroke-width="3" fill="none"/>
  
  <!-- Sensor -->
  <circle cx="50" cy="82" r="2" fill="#e53e3e"/>
</svg>
