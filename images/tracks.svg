<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tracksGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Track/Path -->
  <path d="M15 80 Q30 70 45 75 Q60 80 75 70 Q85 65 90 50 Q85 35 75 30 Q60 20 45 25 Q30 30 15 20" 
        stroke="url(#tracksGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Track markers -->
  <circle cx="20" cy="75" r="3" fill="#4299e1"/>
  <circle cx="35" cy="72" r="3" fill="#48bb78"/>
  <circle cx="50" cy="77" r="3" fill="#ed8936"/>
  <circle cx="65" cy="75" r="3" fill="#9f7aea"/>
  <circle cx="80" cy="67" r="3" fill="#38b2ac"/>
  
  <!-- Progress indicator -->
  <circle cx="50" cy="77" r="5" fill="#feca57" stroke="#f6ad55" stroke-width="2"/>
  <text x="50" y="80" text-anchor="middle" font-family="Arial" font-size="6" fill="#2d3748" font-weight="bold">3</text>
  
  <!-- Milestone flags -->
  <polygon points="18,70 18,65 25,67.5" fill="#e53e3e"/>
  <line x1="18" y1="70" x2="18" y2="77" stroke="#2d3748" stroke-width="2"/>
  
  <polygon points="82,62 82,57 89,59.5" fill="#38a169"/>
  <line x1="82" y1="62" x2="82" y2="69" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Learning modules -->
  <rect x="10" y="25" width="20" height="12" rx="2" fill="#4299e1" opacity="0.8"/>
  <text x="20" y="32" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff" font-weight="bold">HTML</text>
  
  <rect x="40" y="15" width="20" height="12" rx="2" fill="#48bb78" opacity="0.8"/>
  <text x="50" y="22" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff" font-weight="bold">CSS</text>
  
  <rect x="70" y="20" width="20" height="12" rx="2" fill="#ed8936" opacity="0.8"/>
  <text x="80" y="27" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff" font-weight="bold">JS</text>
  
  <!-- Progress bar -->
  <rect x="15" y="90" width="70" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="15" y="90" width="42" height="4" rx="2" fill="url(#tracksGradient)"/>
  
  <!-- Title -->
  <text x="50" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">LEARNING TRACKS</text>
</svg>
