<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#avatarGradient)" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Head -->
  <circle cx="50" cy="35" r="15" fill="#fdbcb4" stroke="#e4a688" stroke-width="1"/>
  
  <!-- Hair -->
  <path d="M35 30 Q50 20 65 30 Q65 25 50 20 Q35 25 35 30" fill="#8b4513"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="32" r="2" fill="#2c3e50"/>
  <circle cx="55" cy="32" r="2" fill="#2c3e50"/>
  <circle cx="45.5" cy="31.5" r="0.8" fill="#fff"/>
  <circle cx="55.5" cy="31.5" r="0.8" fill="#fff"/>
  
  <!-- Nose -->
  <ellipse cx="50" cy="36" rx="1" ry="1.5" fill="#e4a688"/>
  
  <!-- Mouth -->
  <path d="M47 39 Q50 42 53 39" stroke="#e4a688" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body/Shirt -->
  <ellipse cx="50" cy="70" rx="20" ry="25" fill="url(#shirtGradient)" stroke="#fff" stroke-width="1"/>
  
  <!-- GT Logo on Shirt -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#fff">
    GT
  </text>
  
  <!-- Arms -->
  <ellipse cx="32" cy="60" rx="6" ry="12" fill="#fdbcb4" stroke="#e4a688" stroke-width="1"/>
  <ellipse cx="68" cy="60" rx="6" ry="12" fill="#fdbcb4" stroke="#e4a688" stroke-width="1"/>
  
  <!-- Hands -->
  <circle cx="32" cy="72" r="4" fill="#fdbcb4" stroke="#e4a688" stroke-width="1"/>
  <circle cx="68" cy="72" r="4" fill="#fdbcb4" stroke="#e4a688" stroke-width="1"/>
  
  <!-- GT Badge on chest -->
  <rect x="45" y="55" width="10" height="6" rx="2" fill="#fff" stroke="#667eea" stroke-width="0.5"/>
  <text x="50" y="59" font-family="Arial, sans-serif" font-size="3" font-weight="bold" text-anchor="middle" fill="#667eea">
    GT
  </text>
</svg>
