# Server Configuration
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/RewardHub

# PostgreSQL Database (uses environment variables with defaults for local dev)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gtshop}
spring.datasource.username=${DATABASE_USER:gtshop_user}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
