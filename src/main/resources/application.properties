spring.application.name=rewardhub

# ---------------------------------------------------------------- Server
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=/RewardHub
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.max-swallow-size=256KB
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
# API-ul nu serveste fisiere statice (frontend-ul este servit de nginx)
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# ---------------------------------------------------------------- Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gtshop}
spring.datasource.username=${DATABASE_USER:gtshop_user}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: in productie schema exista deja -> V1 este marcata ca baseline, ruleaza doar V2+
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema productie 2026-11

# ---------------------------------------------------------------- Security / JWT
# JWT_SECRET este obligatoriu (minim 32 de caractere); aplicatia refuza sa porneasca altfel.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}
jwt.issuer=rewardhub

# ---------------------------------------------------------------- Aplicatie
rewardhub.timezone=Europe/Bucharest
rewardhub.public-base-url=${PUBLIC_BASE_URL:https://shop.micutu.com}
rewardhub.cors-origins=${CORS_ORIGINS:https://shop.micutu.com,https://rewardhub.micutu.com}
rewardhub.admin-emails=${ADMIN_EMAILS:}
rewardhub.trust-proxy-headers=${TRUST_PROXY_HEADERS:true}

# ---------------------------------------------------------------- OpenAPI (dezactivat implicit in productie)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------- Actuator (doar health, pe loopback)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
